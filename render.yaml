services:
  - type: web
    name: missav-crawler
    runtime: go
    region: singapore
    plan: free
    buildCommand: go build -o app
    startCommand: ./app
    healthCheckPath: /status
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: missav-db
          property: connectionString
      - key: CRAWL_MODE
        value: incremental
      - key: CRAWL_INTERVAL
        value: 6h
      - key: JOB_LIMIT
        value: 0
      - key: DETAIL_LIMIT
        value: 0

databases:
  - name: missav-db
    region: singapore
    plan: free
    databaseName: missav
